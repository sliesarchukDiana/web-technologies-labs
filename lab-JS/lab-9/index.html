<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизація та Реєстрація</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="form-container">
    <div class="tabs">
        <button class="tab-btn active" data-target="signup">Signup</button>
        <button class="tab-btn" data-target="login">Login</button>
    </div>

    <div id="global-message" class="hidden"></div>

    <form id="signup" class="form-content active" novalidate>
        <h2>Create an account</h2>

        <div class="form-row">
            <div class="form-group">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" name="firstName" placeholder="Mark">
                <small class="error-text"></small>
            </div>
            <div class="form-group">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" name="lastName" placeholder="Otto">
                <small class="error-text"></small>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter email">
            <small class="error-text"></small>
        </div>

        <div class="form-row">
            <div class="form-group password-group">
                <label for="signup-password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="signup-password" name="password" placeholder="Enter password">
                    <button type="button" class="toggle-password">👁️</button>
                </div>
                <small class="error-text"></small>
            </div>
            <div class="form-group password-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirm-password" name="confirmPassword" placeholder="Enter password">
                    <button type="button" class="toggle-password">👁️</button>
                </div>
                <small class="error-text"></small>
            </div>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" placeholder="+380...">
            <small class="error-text"></small>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="birthDate">Date Birth</label>
                <input type="date" id="birthDate" name="birthDate">
                <small class="error-text"></small>
            </div>
            <div class="form-group">
                <label>Sex</label>
                <div class="radio-group">
                    <label><input type="radio" name="sex" value="male"> Male</label>
                    <label><input type="radio" name="sex" value="female"> Female</label>
                </div>
                <small class="error-text"></small>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="country">Country</label>
                <select id="country" name="country">
                    <option value="">Choose...</option>
                    <option value="ukraine">Ukraine</option>
                    <option value="usa">USA</option>
                </select>
                <small class="error-text"></small>
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <select id="city" name="city" disabled>
                    <option value="">Choose country first...</option>
                </select>
                <small class="error-text"></small>
            </div>
        </div>

        <button type="submit" class="submit-btn">Signup</button>
    </form>

    <form id="login" class="form-content hidden" novalidate>
        <h2>Login here</h2>

        <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" name="username" placeholder="Enter username">
            <small class="error-text"></small>
        </div>

        <div class="form-group password-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
                <input type="password" id="login-password" name="password" placeholder="Enter password">
                <button type="button" class="toggle-password">👁️</button>
            </div>
            <small class="error-text"></small>
        </div>

        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" name="rememberMe"> Remember Me
            </label>
        </div>

        <button type="submit" class="submit-btn">Login</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
